<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NCE2 英语学习打卡</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lesson-card { cursor: pointer; transition: all 0.2s; }
        .lesson-card.completed { border-color: #10b981; background: #f0fdf4; color: #059669; }
        .hidden { display: none; }
        body { -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .speaker-icon { 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            margin-left: 6px; 
            color: #6366f1; 
            transition: transform 0.1s;
        }
        .speaker-icon:active { transform: scale(1.2); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">新概念英语第二册学习</h1>
            <div id="sync-status" class="text-[10px] text-emerald-400 font-mono">正在连接云端...</div>
        </div>
        <button onclick="logout()" class="text-[10px] bg-slate-700 px-3 py-1 rounded-full border border-slate-600">切换账号</button>
    </header>

    <div id="auth-overlay" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
            <div class="text-4xl mb-4">🚀</div>
            <h2 class="text-xl font-bold mb-2">欢迎回来</h2>
            <p class="text-gray-400 text-xs mb-6">输入学习暗号，多端同步进度</p>
            <input type="text" id="user-secret" placeholder="例如: study_2026" class="w-full border-2 border-slate-100 rounded-xl p-3 mb-4 outline-none focus:border-indigo-500 text-center font-bold text-lg">
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold active:scale-95 transition">进入系统</button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        <div class="bg-white rounded-2xl p-4 mb-6 shadow-sm border border-slate-100">
            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase">
                <span>Overall Progress</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-700" style="width: 0%"></div>
            </div>
        </div>

        <div id="plan-settings" class="hidden mb-6"></div>

        <div id="home-view" class="flex flex-col space-y-6"></div>

        <div id="detail-view" class="hidden animate-in">
<button onclick="showHome()" class="mb-5 text-indigo-600 font-bold flex items-center text-sm">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回课程表
            </button>
            <div id="detail-content" class="bg-white rounded-3xl shadow-xl p-6 border border-slate-100"></div>
        </div>
    </main>

    <script src="lesson-index.js"></script>

    <script>
        let currentAudio = null; // 用于全局追踪正在播放的音频
        const SUPABASE_URL = 'https://nblwcljnherlbhngeabw.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ibHdjbGpuaGVybGJobmdlYWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MzY5MDAsImV4cCI6MjA5NDMxMjkwMH0.ngx8sAJxxz2GFk3jWJDeaKDzq5nWfYBY1im1gAPkGfI'; 
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = localStorage.getItem('nce2_user_secret');
        let completedLessons = [];
        let weeklyGoal = parseInt(localStorage.getItem('nce2_weekly_goal')) || 7;

function speak(text) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio.load(); // 强制释放手机内存
    }

    if (!text) return;

    const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=1`;
    const audio = new Audio();
    
    // 关键：先赋值 src 再 play
    audio.src = audioUrl;
    currentAudio = audio;

    // 手机端必须要捕获 play 的结果
    const playPromise = audio.play();
    if (playPromise !== undefined) {
        playPromise.catch(e => {
            console.log("拦截播放，尝试系统语音");
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        });
    }
}
        async function init() {
            if (!currentUser) {
                document.getElementById('auth-overlay').classList.remove('hidden');
            } else {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('plan-settings').classList.remove('hidden');
                await fetchProgress();
                renderHome();
            }
        }

      async function fetchProgress() {
    document.getElementById('sync-status').innerText = "☁️ 同步中...";
    try {
        // 同时获取进度和用户设置
        const [progressRes, settingsRes] = await Promise.all([
            _supabase.from('learning_progress').select('lesson_id').eq('user_id', currentUser),
            _supabase.from('user_settings').select('weekly_goal').eq('user_id', currentUser).maybeSingle()
        ]);

        if (!progressRes.error) {
            completedLessons = progressRes.data.map(item => item.lesson_id);
        }

        // 如果云端有设置，就使用云端的每周目标
        if (!settingsRes.error && settingsRes.data) {
            weeklyGoal = settingsRes.data.weekly_goal;
        }

        updateStats();
    } catch (err) {
        document.getElementById('sync-status').innerText = "❌ 同步失败";
    }
}

        function updateStats() {
            const percent = Math.round((completedLessons.length / 96) * 100);
            document.getElementById('progress-percent').innerText = percent + '%';
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('sync-status').innerText = `✅ 已同步 (已学 ${completedLessons.length} 课)`;
        }

        function getGroupedLessons() {
            const groups = [];
            for (let i = 1; i <= 96; i += weeklyGoal) {
                const group = [];
                for (let j = i; j < i + weeklyGoal && j <= 96; j++) {
                    group.push(j);
                }
                groups.push(group);
            }
            return groups;
        }

        
       async function setWeeklyGoal() {
    const num = prompt("你计划每周学习几课？", weeklyGoal);
    if (num && !isNaN(num)) {
        const val = parseInt(num);
        if (val > 0 && val <= 96) {
            weeklyGoal = val;
            renderHome(); // 立即更新本地 UI

            // 同步到云端数据库
            const { error } = await _supabase
                .from('user_settings')
                .upsert({ 
                    user_id: currentUser, 
                    weekly_goal: val,
                    updated_at: new Date() 
                });

            if (error) {
                console.error("同步失败:", error);
                alert("云端更新失败，请检查网络");
            }
        }
    }
}

        function renderHome() {
            const home = document.getElementById('home-view');
            const settings = document.getElementById('plan-settings');
            
            // 渲染设置栏
            settings.innerHTML = `
                <div class="flex justify-between items-center bg-white/50 p-3 rounded-xl border border-dashed border-slate-200">
                    <div class="text-sm text-slate-600">
                        <span class="font-bold text-indigo-600">当前计划：</span>每周学习 <span class="font-mono font-bold">${weeklyGoal}</span> 课
                    </div>
                    <button onclick="setWeeklyGoal()" class="text-xs font-bold text-indigo-500 hover:text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg transition-colors">
                        修改计划
                    </button>
                </div>
            `;

            home.innerHTML = '';
            const groups = getGroupedLessons();

            groups.forEach((group, index) => {
                const groupCompleted = group.filter(id => completedLessons.includes(id)).length;
                const progressPercent = Math.round((groupCompleted / group.length) * 100);
                const isFullyDone = progressPercent === 100;

                let groupHtml = `
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 animate-in">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="text-lg font-black text-slate-800">第 ${index + 1} 周</h3>
                                <p class="text-[10px] text-slate-400 font-mono tracking-tighter uppercase">Lessons ${group[0]} - ${group[group.length-1]}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-black ${isFullyDone ? 'text-emerald-500' : 'text-slate-700'}">${progressPercent}%</span>
                                <div class="w-16 h-1.5 bg-slate-100 rounded-full mt-1 overflow-hidden">
                                    <div class="h-full transition-all duration-500 ${isFullyDone ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width: ${progressPercent}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            ${group.map(id => {
                                const isDone = completedLessons.includes(id);
                                const title = lessonIndex[id] || "Coming Soon...";
                                const isAvailable = !!lessonIndex[id];
                                return `
                                    <div onclick="${isAvailable ? `showDetail(${id})` : ''}" 
                                         class="p-3 rounded-2xl border-2 transition-all flex flex-col justify-center min-h-[75px] text-center
                                         ${isDone ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 'bg-slate-50 border-transparent text-slate-600'} 
                                         ${!isAvailable ? 'opacity-30 grayscale cursor-not-allowed' : 'hover:border-indigo-200 active:scale-95 cursor-pointer'}">
                                        <span class="text-[9px] font-mono opacity-50 mb-1">L${id}</span>
                                        <span class="text-[11px] font-bold leading-tight line-clamp-2">${title}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                home.innerHTML += groupHtml;
            });
        }

async function showDetail(id) {
    // 1. 初始化：停止当前音频，滚动到顶部
    if (typeof speak === 'function') speak(); 
    window.scrollTo(0, 0);
    
    if (!lessonIndex[id]) return;

    // 2. 加载课文脚本
    const script = document.createElement('script');
    script.src = `data/lesson${id}.js?t=${Date.now()}`; // 自动解决缓存问题
    script.async = true;

    script.onload = () => {
        const data = window.currentLessonData;
        if (!data) {
            alert("课文数据格式错误");
            return;
        }

        const detailView = document.getElementById('detail-view');
        const homeView = document.getElementById('home-view');
        const settings = document.getElementById('plan-settings');
        const content = document.getElementById('detail-content');

        const isDone = completedLessons.includes(id);
        const prevId = id > 1 ? id - 1 : null;
        const nextId = id < 96 && lessonIndex[id + 1] ? id + 1 : null;

        // --- 核心改进：全文音频文本清洗 ---
        // 我们保留句号、问号、逗号以维持语感停顿，但剔除引号以防止 HTML 崩溃
        const safeAudioText = data.textEn
            .replace(/['"`]/g, '')      // 删掉所有引号
            .replace(/[\r\n]+/g, ' ')   // 换行改空格
            .replace(/\s+/g, ' ')       // 合并多余空格
            .trim();

        let html = '';

        // 3. 头部导航与打卡按钮
        html += `
            <div class="flex justify-between items-center mb-6">
                <button onclick="showHome()" class="text-indigo-600 font-bold flex items-center text-sm">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回课程表
                </button>
                <div class="flex space-x-2">
                    ${prevId ? `<button onclick="showDetail(${prevId})" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">← 上一课</button>` : ''}
                    ${nextId ? `<button onclick="showDetail(${nextId})" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">下一课 →</button>` : ''}
                </div>
            </div>

            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 class="text-2xl font-black text-slate-800">Lesson ${id}</h2>
                    <p class="text-indigo-600 font-medium">${data.title}</p>
                </div>
                <button onclick="toggleDone(${id})" id="check-btn" class="px-6 py-2 rounded-full font-bold transition-all ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'}">
                    ${isDone ? '✓ 已打卡' : '确认打卡'}
                </button>
            </div>
        `;

        // 4. 课文展示与播放按钮
        if (data.textEn && data.textCn) {
            html += `
            <div class="mb-8 p-6 bg-indigo-50/50 rounded-2xl border border-indigo-100 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-indigo-600">课文原文 & 译文</h3>
                    <button onclick="speak(\`${safeAudioText}\`)" 
                            class="flex items-center text-[10px] bg-indigo-600 text-white px-3 py-1 rounded-full active:scale-95 transition-all shadow-sm">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></path></svg>
                        播放全文 (0.85x)
                    </button>
                </div>
                <div class="space-y-4">
                    <p class="text-slate-800 font-serif leading-relaxed text-sm">${data.textEn}</p>
                    <div class="pt-4 border-t border-indigo-100/50">
                        <p class="text-slate-500 text-xs leading-relaxed">${data.textCn}</p>
                    </div>
                </div>
            </div>`;
        }

        // 5. 单词表渲染
        if (data.words && data.words.length > 0) {
            html += `
            <div class="mb-8 overflow-hidden rounded-2xl border border-slate-100 shadow-sm text-sm">
                <table class="w-full text-left bg-white">
                    <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase"><th class="p-3">单词</th><th class="p-3 text-right">释义</th></tr>
                    ${data.words.map(w => `
                        <tr class="border-t border-slate-50">
                            <td class="p-3">
                                <div class="flex items-center">
                                    <span class="font-bold text-slate-800">${w.word}</span>
                                    <button onclick="speak('${w.word.replace(/'/g, "\\'")}')" class="speaker-icon">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                                <div class="text-[10px] text-slate-400 font-mono">${w.phonetic || ''}</div>
                            </td>
                            <td class="p-3 text-right text-slate-500 italic text-xs">${w.type || ''} ${w.trans}</td>
                        </tr>
                    `).join('')}
                </table>
            </div>`;
        }

        // 6. 学习笔记渲染
        if (data.sections) {
            html += `<div class="space-y-4">`;
            data.sections.forEach(sec => {
                html += `
                <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-indigo-400">
                    <p class="text-slate-800 italic font-serif mb-1">"${sec.sentence}"</p>
                    ${sec.notes.map(n => `<p class="text-[11px] text-slate-500 flex items-start mt-1">● ${n}</p>`).join('')}
                </div>`;
            });
            html += `</div>`;
        }

        // 7. 视图切换
        content.innerHTML = html;
        homeView.classList.add('hidden');
        settings.classList.add('hidden');
        detailView.classList.remove('hidden');
    };

    script.onerror = () => alert("加载失败，请检查 data 文件夹中是否存在 lesson" + id + ".js");
    document.body.appendChild(script);
}

        async function toggleDone(id) {
            const btn = document.getElementById('check-btn');
            btn.innerText = "请求中...";
            btn.disabled = true;
            try {
                if (completedLessons.includes(id)) {
                    await _supabase.from('learning_progress').delete().eq('user_id', currentUser).eq('lesson_id', id);
                    completedLessons = completedLessons.filter(l => l !== id);
                } else {
                    await _supabase.from('learning_progress').insert([{ user_id: currentUser, lesson_id: id }]);
                    completedLessons.push(id);
                }
                showDetail(id);
                updateStats();
            } catch (e) {
                alert("操作失败！");
                showDetail(id);
            }
        }

        function login() {
            const val = document.getElementById('user-secret').value.trim();
            if(val) { currentUser = val; localStorage.setItem('nce2_user_secret', val); init(); }
        }

        function logout() { localStorage.removeItem('nce2_user_secret'); location.reload(); }
   function showHome() { 
    speak(); // 触发清理逻辑，停止所有音频
    
    document.getElementById('home-view').classList.remove('hidden'); 
    document.getElementById('plan-settings').classList.remove('hidden');
    document.getElementById('detail-view').classList.add('hidden'); 
    renderHome(); 
}
        init();
    </script>
</body>
</html>
